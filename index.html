<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Air Guitar - Cuerdas Acústicas en el Aire</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0b0e14;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    /* El video y canvas van espejados para movimiento natural */
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    #ui-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: rgba(15, 20, 30, 0.85);
      padding: 15px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      max-width: 310px;
      backdrop-filter: blur(6px);
    }
    .btn-row {
      display: flex;
      gap: 8px;
    }
    button {
      border: none;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.15s;
    }
    #audio-btn {
      background: #f59e0b;
      color: #000;
      flex: 1;
    }
    #clear-btn {
      background: #ef4444;
      color: #fff;
    }
    button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    #status {
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="ui-panel">
      <div class="btn-row">
        <button id="audio-btn">🎸 Activar Guitarra</button>
        <button id="clear-btn">🗑️ Borrar</button>
      </div>
      <div id="status">
        1. Activa el sonido.<br>
        2. Haz pinza con ambas manos: <b>cuerda larga = grave</b>, <b>cuerda corta = aguda</b>.<br>
        3. Suelta para fijarla y rasguea con tu dedo índice.
      </div>
    </div>
    <video id="webcam" autoplay playsinline></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const audioBtn = document.getElementById('audio-btn');
    const clearBtn = document.getElementById('clear-btn');

    // --- 1. MOTOR DE GUITARRA ACÚSTICA (Síntesis Karplus-Strong) ---
    let audioCtx = null;
    const NOTE_NAMES = ['Do', 'Do#', 'Re', 'Re#', 'Mi', 'Fa', 'Fa#', 'Sol', 'Sol#', 'La', 'La#', 'Si'];

    audioBtn.addEventListener('click', () => {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      audioBtn.innerText = '🎸 Guitarra Lista';
      audioBtn.style.background = '#10b981';
    });

    // Calcula frecuencia y nombre de nota según el largo de la cuerda en pantalla
    function getStringPitchData(lengthPx, screenWidth) {
      // Normalizamos el largo entre 60px (muy corta) y 75% del ancho de pantalla (muy larga)
      const minLen = 60;
      const maxLen = Math.max(300, screenWidth * 0.75);
      const clamped = Math.max(minLen, Math.min(maxLen, lengthPx));
      
      // Ratio: 0 = cuerda más corta (aguda), 1 = cuerda más larga (grave)
      const ratio = (clamped - minLen) / (maxLen - minLen);

      // Rango real de guitarra acústica: desde Mi2 (82.41 Hz, 6ta cuerda) hasta Mi5 (659.25 Hz)
      // Usamos escala logarítmica para que la progresión musical sea natural
      const minFreq = 82.41;  // E2 (Grave)
      const maxFreq = 659.25; // E5 (Agudo)
      const freq = maxFreq * Math.pow(minFreq / maxFreq, ratio);

      // Obtener nombre aproximado de la nota musical
      const midi = Math.round(69 + 12 * Math.log2(freq / 440));
      const noteName = NOTE_NAMES[midi % 12] + (Math.floor(midi / 12) - 1);

      return { freq, noteName, ratio };
    }

    // Genera un sonido de cuerda pulsada acústica realista
    function playAcousticGuitar(freq) {
      if (!audioCtx || audioCtx.state !== 'running') return;

      const sampleRate = audioCtx.sampleRate;
      const duration = 2.6; // Sostenido natural de guitarra acústica
      const totalSamples = Math.floor(sampleRate * duration);
      const buffer = audioCtx.createBuffer(1, totalSamples, sampleRate);
      const data = buffer.getChannelData(0);

      // Período en muestras correspondiente a la frecuencia
      const period = Math.round(sampleRate / freq);
      const delayLine = new Float32Array(period);

      // Inicializamos la cuerda con un "rasgueo" (ruido filtrado suave para simular púa/dedo)
      let lastVal = 0;
      for (let i = 0; i < period; i++) {
        const white = Math.random() * 2 - 1;
        // Suavizamos el ruido inicial para que suene a madera/nailon y no a estática metálica
        lastVal = 0.5 * white + 0.5 * lastVal;
        delayLine[i] = lastVal;
      }

      // Factor de amortiguación: cuerdas graves vibran más tiempo que las agudas
      const damping = freq < 160 ? 0.9965 : (freq < 330 ? 0.9945 : 0.9915);

      let ptr = 0;
      for (let i = 0; i < totalSamples; i++) {
        const current = delayLine[ptr];
        const next = delayLine[(ptr + 1) % period];
        
        // Filtro promediador Karplus-Strong (simula pérdida de agudos de la cuerda real)
        const filtered = damping * 0.5 * (current + next);
        delayLine[ptr] = filtered;
        data[i] = current;

        ptr = (ptr + 1) % period;
      }

      // Reproducir el buffer pasando por filtros de caja de resonancia acústica
      const source = audioCtx.createBufferSource();
      source.buffer = buffer;

      // Resonancia de la caja de madera (~110Hz - 220Hz)
      const bodyResonance = audioCtx.createBiquadFilter();
      bodyResonance.type = 'peaking';
      bodyResonance.frequency.value = 180;
      bodyResonance.Q.value = 2.2;
      bodyResonance.gain.value = 6.5;

      // Calidez general (recorte de frecuencias ásperas)
      const warmthFilter = audioCtx.createBiquadFilter();
      warmthFilter.type = 'lowpass';
      warmthFilter.frequency.value = 3200;

      const masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.85;

      source.connect(bodyResonance);
      bodyResonance.connect(warmthFilter);
      warmthFilter.connect(masterGain);
      masterGain.connect(audioCtx.destination);

      source.start();
    }

    // --- 2. GESTIÓN DE CUERDAS EN EL AIRE ---
    const COLORS = ['#fbbf24', '#34d399', '#38bdf8', '#a78bfa', '#f472b6'];
    let anchoredStrings = [];
    let isDrawingNewString = false;
    let draftString = null;
    let particles = [];

    clearBtn.addEventListener('click', () => {
      anchoredStrings = [];
    });

    function getPinchPoint(landmarks, width, height) {
      const thumb = landmarks[4];
      const index = landmarks[8];
      const dist = Math.hypot((thumb.x - index.x) * width, (thumb.y - index.y) * height);
      
      if (dist < 45) {
        return {
          x: ((thumb.x + index.x) / 2) * width,
          y: ((thumb.y + index.y) / 2) * height
        };
      }
      return null;
    }

    function pointToSegmentDist(px, py, x1, y1, x2, y2) {
      const l2 = (x2 - x1) ** 2 + (y2 - y1) ** 2;
      if (l2 === 0) return Math.hypot(px - x1, py - y1);
      let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(px - (x1 + t * (x2 - x1)), py - (y1 + t * (y2 - y1)));
    }

    function spawnSparks(x, y, color) {
      for (let i = 0; i < 12; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.5 + Math.random() * 3.5;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1.0,
          color
        });
      }
    }

    // Dibuja texto legible encima del canvas espejado
    function drawUnmirroredText(ctx, text, x, y, color = '#fff') {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(-1, 1); // Contrarresta el scaleX(-1) del CSS para que el texto no salga al revés
      ctx.font = 'bold 14px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
      const width = ctx.measureText(text).width + 14;
      ctx.fillRect(-width / 2, -22, width, 22);
      ctx.fillStyle = color;
      ctx.fillText(text, 0, -6);
      ctx.restore();
    }

    function drawString(ctx, str, isDraft = false) {
      const dx = str.x2 - str.x1;
      const dy = str.y2 - str.y1;
      const dist = Math.hypot(dx, dy);
      if (dist < 10) return;

      const nx = -dy / dist;
      const ny = dx / dist;

      // Grosor visual: las cuerdas largas (graves) se ven más gruesas como en una guitarra real
      const baseThickness = 1.8 + (str.ratio || 0.5) * 3.2;

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(str.x1, str.y1);

      if (isDraft) {
        ctx.setLineDash([8, 6]);
        ctx.lineTo(str.x2, str.y2);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.lineWidth = baseThickness;
        ctx.stroke();

        // Mostrar qué nota y frecuencia tendrá antes de soltar
        const midX = (str.x1 + str.x2) / 2;
        const midY = (str.y1 + str.y2) / 2;
        drawUnmirroredText(ctx, `${str.noteName} (${Math.round(str.freq)} Hz)`, midX, midY - 12, '#fbbf24');
      } else {
        const segments = 36;
        for (let i = 1; i < segments; i++) {
          const t = i / segments;
          const envelope = Math.sin(t * Math.PI);
          const wave = Math.sin(t * Math.PI * 3 + str.phase) * str.vibration * envelope;
          ctx.lineTo(str.x1 + dx * t + nx * wave, str.y1 + dy * t + ny * wave);
        }
        ctx.lineTo(str.x2, str.y2);

        const isVibrating = str.vibration > 0.8;
        ctx.strokeStyle = isVibrating ? '#ffffff' : str.color;
        ctx.lineWidth = isVibrating ? baseThickness + 1.5 : baseThickness;
        ctx.shadowColor = str.color;
        ctx.shadowBlur = isVibrating ? 20 : 10;
        ctx.stroke();

        // Etiqueta discreta de la nota en el centro
        const midX = (str.x1 + str.x2) / 2;
        const midY = (str.y1 + str.y2) / 2;
        drawUnmirroredText(ctx, str.noteName, midX, midY - 10, str.color);
      }

      // Clavijas / Nodos en los extremos
      ctx.setLineDash([]);
      [ [str.x1, str.y1], [str.x2, str.y2] ].forEach(([cx, cy]) => {
        ctx.beginPath();
        ctx.arc(cx, cy, isDraft ? 6 : 7.5, 0, Math.PI * 2);
        ctx.fillStyle = isDraft ? '#fbbf24' : str.color;
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
      });

      ctx.restore();
    }

    // --- 3. BUCLE MEDIAPIPE ---
    function onResults(results) {
      const w = canvasElement.width;
      const h = canvasElement.height;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, w, h);

      const hands = results.multiHandLandmarks || [];
      let activePinches = [];
      let indexTips = [];

      for (const landmarks of hands) {
        drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {
          color: 'rgba(255, 255, 255, 0.2)',
          lineWidth: 1.5
        });
        drawLandmarks(canvasCtx, landmarks, {
          color: '#fbbf24',
          lineWidth: 1,
          radius: 2.5
        });

        const pinch = getPinchPoint(landmarks, w, h);
        if (pinch) {
          activePinches.push(pinch);
          canvasCtx.beginPath();
          canvasCtx.arc(pinch.x, pinch.y, 14, 0, Math.PI * 2);
          canvasCtx.strokeStyle = '#10b981';
          canvasCtx.lineWidth = 3;
          canvasCtx.stroke();
        }

        indexTips.push({
          x: landmarks[8].x * w,
          y: landmarks[8].y * h,
          isPinching: !!pinch
        });
      }

      // A: Crear y fijar cuerda al soltar
      if (activePinches.length === 2) {
        isDrawingNewString = true;
        const x1 = activePinches[0].x;
        const y1 = activePinches[0].y;
        const x2 = activePinches[1].x;
        const y2 = activePinches[1].y;
        const len = Math.hypot(x2 - x1, y2 - y1);
        const pitchData = getStringPitchData(len, w);

        draftString = {
          x1, y1, x2, y2,
          freq: pitchData.freq,
          noteName: pitchData.noteName,
          ratio: pitchData.ratio
        };
        drawString(canvasCtx, draftString, true);
      } else if (isDrawingNewString && draftString) {
        const length = Math.hypot(draftString.x2 - draftString.x1, draftString.y2 - draftString.y1);
        if (length > 50) {
          const color = COLORS[anchoredStrings.length % COLORS.length];
          anchoredStrings.push({
            ...draftString,
            color: color,
            vibration: 16,
            phase: 0,
            cooldown: 16
          });
          playAcousticGuitar(draftString.freq);
          spawnSparks((draftString.x1 + draftString.x2) / 2, (draftString.y1 + draftString.y2) / 2, color);
        }
        isDrawingNewString = false;
        draftString = null;
      }

      // B: Dibujar y tocar cuerdas fijas
      for (const str of anchoredStrings) {
        if (str.cooldown > 0) str.cooldown--;

        for (const tip of indexTips) {
          if (tip.isPinching) continue;
          const dist = pointToSegmentDist(tip.x, tip.y, str.x1, str.y1, str.x2, str.y2);
          if (dist < 18 && str.cooldown === 0) {
            // Amplitud visual mayor en cuerdas graves (más largas)
            str.vibration = 18 + str.ratio * 12;
            str.cooldown = 16;
            playAcousticGuitar(str.freq);
            spawnSparks(tip.x, tip.y, str.color);
          }
        }

        if (str.vibration > 0.1) {
          // Velocidad de vibración visual también acorde al tono
          str.phase += 1.2 - str.ratio * 0.5;
          str.vibration *= 0.92;
        } else {
          str.vibration = 0;
        }

        drawString(canvasCtx, str, false);
      }

      // C: Partículas
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.04;
        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        canvasCtx.save();
        canvasCtx.globalAlpha = p.life;
        canvasCtx.fillStyle = p.color;
        canvasCtx.beginPath();
        canvasCtx.arc(p.x, p.y, 3.5 * p.life, 0, Math.PI * 2);
        canvasCtx.fill();
        canvasCtx.restore();
      }

      canvasCtx.restore();
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.65,
      minTrackingConfidence: 0.65
    });

    hands.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        if (canvasElement.width !== videoElement.videoWidth) {
          canvasElement.width = videoElement.videoWidth;
          canvasElement.height = videoElement.videoHeight;
        }
        await hands.send({ image: videoElement });
      },
      width: 1280,
      height: 720
    });

    camera.start();
  </script>
</body>
</html>
